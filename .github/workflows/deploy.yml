name: Build and Deploy pSEO Pages

on:
  push:
    branches:
      - main # Runs every time you update a file on the main branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: pip install pandas jinja2

      - name: Run generation script & bundle assets
        run: |
          python build.py
          # Copy your main homepage and images into the output folder so they publish together
          cp index.html output/
          cp *.jpeg output/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
